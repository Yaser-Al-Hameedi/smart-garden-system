<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Crop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f1117;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 24px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #fff;
            letter-spacing: -0.5px;
        }

        header h1 span {
            color: #4ade80;
        }

        #status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 8px #4ade80;
            display: inline-block;
            margin-right: 8px;
        }

        #status-dot.offline {
            background: #f87171;
            box-shadow: 0 0 8px #f87171;
        }

        #last-updated {
            font-size: 0.75rem;
            color: #64748b;
        }

        .section-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 10px;
            margin-top: 24px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 8px;
        }

        .card {
            background: #1e2130;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #2d3148;
        }

        .card-label {
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .card-value {
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
            line-height: 1;
        }

        .card-unit {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-left: 4px;
        }

        .card-sub {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 6px;
        }

        .moisture-bar-wrap {
            margin-top: 10px;
            background: #2d3148;
            border-radius: 4px;
            height: 6px;
            overflow: hidden;
        }

        .moisture-bar {
            height: 100%;
            border-radius: 4px;
            background: #4ade80;
            transition: width 0.5s ease;
        }

        .section-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        thead th {
            text-align: left;
            color: #64748b;
            font-weight: 500;
            padding: 8px 12px;
            border-bottom: 1px solid #2d3148;
        }

        tbody tr {
            border-bottom: 1px solid #1a1e2e;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        tbody td {
            padding: 10px 12px;
            color: #cbd5e1;
        }

        .trigger-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .trigger-auto {
            background: #14532d;
            color: #4ade80;
        }

        .trigger-manual {
            background: #1e3a5f;
            color: #60a5fa;
        }

        .empty {
            color: #475569;
            font-size: 0.85rem;
            padding: 16px 12px;
        }
    </style>
</head>
<body>

<header>
    <h1>Cloud<span>Crop</span></h1>
    <div>
        <span id="status-dot"></span>
        <span id="last-updated">Loading...</span>
    </div>
</header>

<div class="section-label">Sensors</div>
<div class="grid">
    <div class="card">
        <div class="card-label">Soil Moisture</div>
        <div class="card-value" id="soil-value">--</div>
        <div class="card-sub" id="soil-percent">-- %</div>
        <div class="moisture-bar-wrap">
            <div class="moisture-bar" id="moisture-bar" style="width: 0%"></div>
        </div>
    </div>

    <div class="card">
        <div class="card-label">Sensor Temperature</div>
        <div class="card-value" id="temp-value">--<span class="card-unit">°C</span></div>
        <div class="card-sub">DS18B20 — indoor sensor</div>
    </div>

    <div class="card">
        <div class="card-label">Light</div>
        <div class="card-value" id="light-value">--<span class="card-unit">lux</span></div>
        <div class="card-sub">BH1750 light sensor</div>
    </div>
</div>

<div class="section-label">Weather</div>
<div class="grid">
    <div class="card">
        <div class="card-label">Outdoor Temperature</div>
        <div class="card-value" id="weather-temp">--<span class="card-unit">°C</span></div>
        <div class="card-sub" id="weather-desc">--</div>
    </div>

    <div class="card">
        <div class="card-label">Humidity</div>
        <div class="card-value" id="humidity-value">--<span class="card-unit">%</span></div>
        <div class="card-sub">Outdoor humidity</div>
    </div>

    <div class="card">
        <div class="card-label">Rain Probability</div>
        <div class="card-value" id="rain-value">--<span class="card-unit">%</span></div>
        <div class="card-sub">Next 3 hours</div>
    </div>
</div>

<div class="section-label" style="margin-bottom: 12px;">Watering History</div>
<div class="card">
    <table>
        <thead>
            <tr>
                <th>Time</th>
                <th>Duration</th>
                <th>Water</th>
                <th>Trigger</th>
            </tr>
        </thead>
        <tbody id="watering-table">
            <tr><td class="empty" colspan="4">Loading...</td></tr>
        </tbody>
    </table>
</div>

<script>
    const API = '';

    function formatTime(isoString) {
        const d = new Date(isoString);
        return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    async function fetchSensors() {
        const res = await fetch(`${API}/api/sensors/current`);
        if (!res.ok) throw new Error('sensors');
        return res.json();
    }

    async function fetchWeather() {
        const res = await fetch(`${API}/api/weather/current`);
        if (!res.ok) throw new Error('weather');
        return res.json();
    }

    async function fetchWaterings() {
        const res = await fetch(`${API}/api/watering/history?hours=24`);
        if (!res.ok) throw new Error('waterings');
        return res.json();
    }

    function updateSensors(data) {
        if (!data || Object.keys(data).length === 0) return;
        const raw = data.soil_moisture;
        const pct = Math.min(100, Math.round((raw / 600) * 100));
        document.getElementById('soil-value').innerHTML = `${raw.toFixed(0)}<span class="card-unit">raw</span>`;
        document.getElementById('soil-percent').textContent = `${pct}% moisture`;
        document.getElementById('moisture-bar').style.width = `${pct}%`;
        document.getElementById('temp-value').innerHTML = `${data.temperature.toFixed(1)}<span class="card-unit">°C</span>`;
        document.getElementById('light-value').innerHTML = `${data.light_level.toFixed(0)}<span class="card-unit">lux</span>`;
    }

    function updateWeather(data) {
        if (!data || Object.keys(data).length === 0) return;
        document.getElementById('weather-temp').innerHTML = `${data.temperature.toFixed(1)}<span class="card-unit">°C</span>`;
        document.getElementById('weather-desc').textContent = data.description;
        document.getElementById('humidity-value').innerHTML = `${data.humidity.toFixed(0)}<span class="card-unit">%</span>`;
        document.getElementById('rain-value').innerHTML = `${(data.rain_probability * 100).toFixed(0)}<span class="card-unit">%</span>`;
    }

    function updateWaterings(data) {
        const tbody = document.getElementById('watering-table');
        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td class="empty" colspan="4">No watering events in the last 24 hours</td></tr>';
            return;
        }
        tbody.innerHTML = data.slice(0, 10).map(w => `
            <tr>
                <td>${formatTime(w.timestamp)}</td>
                <td>${w.duration_seconds.toFixed(1)}s</td>
                <td>${w.model_confidence ? w.model_confidence.toFixed(0) + ' ml' : '--'}</td>
                <td><span class="trigger-badge trigger-${w.trigger}">${w.trigger}</span></td>
            </tr>
        `).join('');
    }

    async function refresh() {
        try {
            const [sensors, weather, waterings] = await Promise.all([
                fetchSensors(),
                fetchWeather(),
                fetchWaterings()
            ]);
            updateSensors(sensors);
            updateWeather(weather);
            updateWaterings(waterings);

            document.getElementById('status-dot').className = '';
            document.getElementById('last-updated').textContent = `Updated ${new Date().toLocaleTimeString()}`;
        } catch (e) {
            document.getElementById('status-dot').className = 'offline';
            document.getElementById('last-updated').textContent = 'Connection lost';
        }
    }

    refresh();
    setInterval(refresh, 30000);
</script>

</body>
</html>
